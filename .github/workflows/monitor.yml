name: MassagemHub Monitor

on:
  schedule:
    # Fortaleza (UTC-3): 00h, 06h, 12h e 18h
    # GitHub Actions usa UTC: 03h, 09h, 15h e 21h.
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massagemhub-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
        

      - name: Run tests
        run: npm test

      - name: Monitor MassagemHub
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_MONITOR_CHAT_ID: ${{ secrets.TELEGRAM_MONITOR_CHAT_ID }}
          TELEGRAM_MONITOR_TOPIC_ID: ${{ secrets.TELEGRAM_MONITOR_TOPIC_ID }}
          MASSAGEMHUB_BASE_URL: https://massagemhub.com.br
          SEND_SUCCESS_SUMMARY: 'true'
          MONITOR_TIMEOUT_MS: '15000'
        run: npm run monitor
