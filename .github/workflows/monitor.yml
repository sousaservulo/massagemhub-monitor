          SEND_SUCCESS_SUMMARY: 'true'
          MONITOR_TIMEOUT_MS: '15000'
        run: npm run monitor

  e2e:
    name: Navegador E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright package
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E checks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_MONITOR_CHAT_ID: ${{ secrets.TELEGRAM_MONITOR_CHAT_ID }}
          TELEGRAM_MONITOR_TOPIC_ID: ${{ secrets.TELEGRAM_MONITOR_TOPIC_ID }}
          MASSAGEMHUB_BASE_URL: https://massagemhub.com.br
          MASSAGEMHUB_ADVERTISER_EMAIL: ${{ secrets.MASSAGEMHUB_ADVERTISER_EMAIL }}
          MASSAGEMHUB_ADVERTISER_PASSWORD: ${{ secrets.MASSAGEMHUB_ADVERTISER_PASSWORD }}
          MASSAGEMHUB_ADMIN_EMAIL: ${{ secrets.MASSAGEMHUB_ADMIN_EMAIL }}
          MASSAGEMHUB_ADMIN_PASSWORD: ${{ secrets.MASSAGEMHUB_ADMIN_PASSWORD }}
          E2E_TIMEOUT_MS: '20000'
          E2E_SCREENSHOTS: 'false'
        run: npm run e2e

      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: massagemhub-e2e-failures
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7
