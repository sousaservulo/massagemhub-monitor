    # GitHub Actions usa UTC: 03h, 09h, 15h e 21h.
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massagemhub-monitor
  cancel-in-progress: false

